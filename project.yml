name: Chorus
options:
  bundleIdPrefix: com.ptt3199
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

targets:
  Chorus:
    type: application
    platform: macOS
    sources:
      - path: Chorus
        excludes:
          - "**/.DS_Store"
          # Chorus PTT: plan, task and hook notes are not app resources.
          - "PTT/**/*.md"
      # The notices the bundled lists and libraries ask for travel with the app.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: licenses
        type: folder
        buildPhase: resources
    resources:
      - path: Chorus/Resources/ServiceCatalog.json
      - path: Chorus/Resources/hagezi-light.json
      - path: Chorus/Resources/fanboy-annoyance.json
      - path: Chorus/Resources/darkreader.js
      - path: Chorus/Resources/NotificationScripts
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ptt3199.Chorus
        PRODUCT_NAME: "Chorus PTT"
        PRODUCT_MODULE_NAME: Chorus
        MARKETING_VERSION: "1.5.31"
        CURRENT_PROJECT_VERSION: "44"
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: Chorus/Info.plist
        CODE_SIGN_ENTITLEMENTS: Chorus/Chorus.entitlements
        ENABLE_HARDENED_RUNTIME: true
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "Chorus forwards notifications from your web services to macOS."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.social-networking"
      configs:
        # Debug builds run under a separate bundle id so a copy launched from
        # Xcode can never share the installed release app's data. The bundle id
        # keys WebKit storage, Preferences, Caches and notifications; the
        # SwiftData store is moved separately in AppState.init (its default path
        # is not bundle-scoped). See fix/isolate-debug-data.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.ptt3199.Chorus.debug
        # Chorus PTT: Release signs ad-hoc too (no Developer ID team).
        Release:
          CODE_SIGN_IDENTITY: "-"
    scheme:
      testTargets:
        - ChorusTests

  ChorusTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ChorusTests
    dependencies:
      - target: Chorus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ptt3199.ChorusTests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        # Required so the test bundle can be code-signed; without an explicit
        # Info.plist this generates one. (Some XcodeGen versions add it by
        # default and some don't, so set it explicitly.)
        GENERATE_INFOPLIST_FILE: true
